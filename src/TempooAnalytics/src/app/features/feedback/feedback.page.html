<div class="min-h-[calc(100vh-80px)] py-12 px-6">
    <div class="max-w-2xl mx-auto">
        <div class="mb-10">
            <h1 class="text-4xl font-extrabold text-white mb-2 tracking-tight">Give Feedback</h1>
            <p class="text-slate-400 text-lg">We'd love to hear your thoughts on how we can improve TempooAnalytics.</p>
        </div>

        <div class="bg-slate-900/50 border border-slate-800 rounded-3xl p-8 shadow-2xl backdrop-blur-sm">
            <form (ngSubmit)="submitFeedback()" #feedbackForm="ngForm" class="space-y-6">
                <div>
                    <label for="title" class="block text-sm font-semibold text-slate-300 mb-2">Subject</label>
                    <input type="text" 
                           id="title" 
                           name="title" 
                           [ngModel]="title()" 
                           (ngModelChange)="title.set($event)"
                           required
                           placeholder="What is this about?"
                           class="w-full bg-slate-800 border border-slate-700 rounded-2xl px-5 py-4 text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500/50 focus:border-sky-500 transition-all shadow-inner">
                </div>

                <div>
                    <label for="description" class="block text-sm font-semibold text-slate-300 mb-2">Details</label>
                    <textarea id="description" 
                              name="description" 
                              [ngModel]="description()" 
                              (ngModelChange)="description.set($event)"
                              required
                              rows="6"
                              placeholder="Tell us more..."
                              class="w-full bg-slate-800 border border-slate-700 rounded-2xl px-5 py-4 text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500/50 focus:border-sky-500 transition-all shadow-inner resize-none"></textarea>
                </div>

                <div class="pt-2">
                    <button type="submit" 
                            [disabled]="isSubmitting() || !title() || !description()"
                            class="w-full bg-sky-600 hover:bg-sky-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-4 px-6 rounded-2xl transition-all shadow-lg shadow-sky-600/20 flex items-center justify-center gap-2">
                        @if (isSubmitting()) {
                            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            Sending...
                        } @else {
                            Send Feedback
                        }
                    </button>
                </div>
            </form>
        </div>

        @if (supportEmail) {
        <div class="mt-8 p-6 bg-sky-500/5 border border-sky-500/10 rounded-2xl">
            <div class="flex gap-4">
                <div class="bg-sky-500/10 p-3 rounded-xl h-fit">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-sky-400"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                </div>
                <div>
                    <h3 class="text-white font-semibold mb-1">Direct Support</h3>
                    <p class="text-slate-400 text-sm">Need urgent help? You can also reach us directly at <a [href]="'mailto:' + supportEmail" class="text-sky-400 hover:underline">{{ supportEmail }}</a></p>
                </div>
            </div>
        </div>
        }
    </div>
</div>
