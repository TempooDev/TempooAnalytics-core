<div class="max-w-md mx-auto mt-12 p-8 bg-slate-900 border border-slate-800 rounded-2xl shadow-xl">
    <div class="mb-8">
        <h2 class="text-2xl font-bold text-white mb-2">Change Security Password</h2>
        <p class="text-slate-400 text-sm">Update your account security credentials.</p>
    </div>

    <form (ngSubmit)="submit()" class="space-y-6">
        <div class="space-y-2">
            <label for="oldPassword" class="block text-sm font-medium text-slate-300">
                Current Password
            </label>
            <div class="relative">
                <input id="oldPassword" name="old" type="password" required aria-required="true"
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-sky-500/40 focus:border-sky-500 transition-all"
                    [ngModel]="oldPassword()" (ngModelChange)="oldPassword.set($event)"
                    placeholder="Enter current password" />
            </div>
        </div>

        <div class="space-y-2">
            <label for="newPassword" class="block text-sm font-medium text-slate-300">
                New Security Password
            </label>
            <div class="relative">
                <input id="newPassword" name="new" type="password" required aria-required="true"
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-sky-500/40 focus:border-sky-500 transition-all"
                    [ngModel]="newPassword()" (ngModelChange)="newPassword.set($event)"
                    placeholder="Create a strong password" />
            </div>
            <p class="text-[10px] text-slate-500 mt-1 italic">Make sure it's at least 8 characters long.</p>
        </div>

        @if (error()) {
        <div role="alert" aria-live="polite"
            class="flex items-center gap-3 p-4 bg-rose-500/10 border border-rose-500/20 rounded-xl text-rose-400 text-sm">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
            {{ error() }}
        </div>
        }

        <div class="pt-2">
            <button type="submit" [disabled]="loading() || !oldPassword() || !newPassword()"
                class="w-full bg-sky-600 hover:bg-sky-500 disabled:bg-slate-800 disabled:text-slate-500 disabled:cursor-not-allowed text-white font-bold py-3 px-6 rounded-xl transition-all shadow-lg shadow-sky-600/20 flex items-center justify-center gap-2">
                @if (loading()) {
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                    </path>
                </svg>
                Processing...
                } @else {
                Update Password
                }
            </button>
        </div>
    </form>
</div>
