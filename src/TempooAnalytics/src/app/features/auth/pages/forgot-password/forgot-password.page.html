<div class="forgot-root">
    <h2>Recuperar contraseña</h2>
    <p>Introduce tu correo y te enviaremos instrucciones. (Simulado en desarrollo)</p>
    <form (submit)="$any($event).preventDefault(); submit()">
        <label>
            Email
            <input type="email" [value]="email()" (input)="email.set($any($event.target).value)" />
        </label>

        <div class="actions">
            <button type="submit" [disabled]="sending()" class="btn btn-primary">Enviar</button>
            <button type="button" (click)="back()" class="btn btn-secondary">Volver</button>
        </div>

        <div class="message" *ngIf="message()">{{ message() }}</div>
    </form>
</div>
