<div class="rounded-2xl bg-slate-900/40 shadow-[0_0_0_1px_rgba(255,255,255,0.03)] p-6">
    <h2 class="text-sm font-medium mb-4">Sites</h2>
    <div class="overflow-x-auto">
        <table class="min-w-full text-xs">
            <thead class="text-slate-400">
                <tr class="border-b border-slate-900/40">
                    <th class="py-2 text-left font-medium">Site</th>
                    <th class="py-2 text-left font-medium">Domain</th>
                    <th class="py-2 text-right font-medium">Pageviews</th>
                    <th class="py-2 text-right font-medium">Visitors</th>
                    <th class="py-2 text-right font-medium">Conversion</th>
                    <th class="py-2 text-right font-medium">Status</th>
                    <th class="py-2"></th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-900/40">
                @for (site of sites(); track site.id) {
                <tr class="group hover:bg-slate-900/60 transition-colors cursor-pointer" (click)="open(site)">
                    <td class="py-2 font-medium">{{ site.name }}</td>
                    <td class="py-2 text-slate-400">{{ site.domain }}</td>
                    <td class="py-2 text-right">{{ site.pageviews | number }}</td>
                    <td class="py-2 text-right">{{ site.visitors | number }}</td>
                    <td class="py-2 text-right">{{ site.conversion }}%</td>

                    <td class="py-2 text-right">
                        <span class="px-2 py-0.5 rounded-full text-[10px]" [class]="site.active
                                ? 'bg-emerald-500/10 text-emerald-400'
                                : 'bg-slate-700/40 text-slate-400'">
                            {{ site.active ? 'Active' : 'Disabled' }}
                        </span>
                    </td>

                    <td class="py-2 text-right w-12">
                        <div class="flex items-center justify-end gap-2">
                            <!-- Delete button -->
                            <button (click)="onDelete($event, site)"
                                class="p-1.5 rounded-lg text-slate-500 hover:text-red-400 hover:bg-red-400/10 opacity-0 group-hover:opacity-100 transition-all"
                                title="Delete Site">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                                </svg>
                            </button>

                            <!-- Chevron icon -->
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                stroke="currentColor"
                                class="w-4 h-4 text-slate-400 group-hover:text-sky-400 transition">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6" />
                            </svg>
                        </div>
                    </td>
                </tr>

                }
            </tbody>
        </table>
    </div>
</div>
