<div
    class="bg-blue-900/20 border border-blue-500/30 rounded-2xl p-6 flex flex-col md:flex-row items-center justify-between gap-4">
    <div class="flex items-start gap-4 text-center md:text-left">
        <div class="p-3 bg-blue-500/10 rounded-xl text-blue-400">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="16" x2="12" y2="12" />
                <line x1="12" y1="8" x2="12.01" y2="8" />
            </svg>
        </div>
        <div>
            <h2 class="text-lg font-semibold text-white">{{ title }}</h2>
            <p class="text-slate-400 text-sm max-w-md">
                {{ message }}
            </p>
        </div>
    </div>
    <div class="flex flex-col sm:flex-row gap-3 items-center">
        <ng-content></ng-content>
        <button (click)="goToDocs()"
            class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-xl font-medium transition-all shadow-lg shadow-blue-600/20 whitespace-nowrap">
            View Documentation
        </button>
    </div>
</div>
