@if (devices().length === 0) {
<div class="flex flex-col items-center justify-center h-40 text-slate-500 text-xs">
    No device data available
</div>
} @else {
<div class="space-y-4">
    @for (item of processedDevices(); track item.type) {
    <div>
        <div class="flex justify-between text-xs mb-1.5">
            <span class="font-medium text-slate-300 capitalize">{{ item.type }}</span>
            <span class="text-slate-400">{{ item.percent }}% <span class="text-slate-600 mx-1">|</span> {{
                item.value | number }}</span>
        </div>
        <div class="h-1.5 bg-slate-800/50 rounded-full overflow-hidden">
            <div class="h-full rounded-full transition-all duration-500" [class]="getColor(item.type)"
                [style.width.%]="item.percent"></div>
        </div>
    </div>
    }
</div>
}
