<div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-4 h-full flex flex-col">
    <div class="flex items-center justify-between mb-4 shrink-0">
        <h2 class="text-sm font-medium">Top locations</h2>
        <div class="flex bg-slate-800/50 p-0.5 rounded-lg border border-slate-700/50">
            <button (click)="activeTab.set('list')"
                [class]="activeTab() === 'list' ? 'bg-slate-700 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'"
                class="px-3 py-1 text-[11px] font-medium rounded-md transition-all duration-200">
                List
            </button>
            <button (click)="activeTab.set('map')"
                [class]="activeTab() === 'map' ? 'bg-slate-700 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'"
                class="px-3 py-1 text-[11px] font-medium rounded-md transition-all duration-200">
                Map
            </button>
        </div>
    </div>

    <div class="flex-1 min-h-0 relative">
        @if (activeTab() === 'map') {
        <ta-location-map [data]="mapData()" [simpleMode]="true" mode="polygons" class="block h-full w-full" />
        } @else {
        <div class="h-full overflow-y-auto pr-1 custom-scrollbar">
            <table class="w-full text-[11px]">
                <tbody class="divide-y divide-slate-800">
                    @for (row of table(); track row.country) {
                    <tr class="group hover:bg-slate-800/30 transition-colors">
                        <td class="py-2 flex items-center gap-2">
                            <span class="text-base leading-none">{{ getFlagEmoji(row.countryCode) }}</span>
                            <span class="font-medium text-slate-200">{{ row.country }}</span>
                        </td>
                        <td class="py-2 text-right font-mono text-slate-300">{{ row.visitors }}</td>
                        <td class="py-2 text-right text-slate-500 w-12">{{ row.percent }}%</td>
                    </tr>
                    } @empty {
                    <tr>
                        <td colspan="3" class="py-8 text-center text-slate-500 italic">No location data available</td>
                    </tr>
                    }
                </tbody>
            </table>
        </div>
        }
    </div>
</div>
