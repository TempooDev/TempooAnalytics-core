@if (upsell) {
<ng-container *ngComponentOutlet="upsell; inputs: { kind: 'header-banner' }" />
}
<header class="sticky top-0 z-100 border-b border-slate-900/30 bg-slate-900/80 backdrop-blur-md py-3 shadow-lg">
    <div class="mx-auto max-w-7xl flex items-center justify-between px-6">
        <div class="flex items-center gap-2 cursor-pointer group" (click)="goHome()">
            <img src="/assets/images/logo.svg" alt="Tempoo Analytics" class="h-8 w-8 transition-transform group-hover:scale-110" />
            <span class="font-extrabold text-xl tracking-tight text-white">{{ settings.brandName }}</span>
        </div>

        <div class="flex items-center gap-3">
            @if (token() && hasPlan()) {
                <a routerLink="/account/profile" 
                   [class.bg-amber-500/10]="currentPlan().toLowerCase().includes('free')"
                   [class.text-amber-500]="currentPlan().toLowerCase().includes('free')"
                   [class.border-amber-500/20]="currentPlan().toLowerCase().includes('free')"
                   [class.bg-purple-500/10]="currentPlan().toLowerCase().includes('enterprise')"
                   [class.text-purple-400]="currentPlan().toLowerCase().includes('enterprise')"
                   [class.border-purple-500/20]="currentPlan().toLowerCase().includes('enterprise')"
                   [class.bg-sky-500/10]="!currentPlan().toLowerCase().includes('free') && !currentPlan().toLowerCase().includes('enterprise')"
                   [class.text-sky-400]="!currentPlan().toLowerCase().includes('free') && !currentPlan().toLowerCase().includes('enterprise')"
                   [class.border-sky-500/20]="!currentPlan().toLowerCase().includes('free') && !currentPlan().toLowerCase().includes('enterprise')"
                   class="hidden sm:flex px-4 py-2 border rounded-xl text-xs font-black hover:bg-white/5 transition-all uppercase tracking-tighter">
                    {{ currentPlan() }} Plan
                </a>
            }

            <button (click)="themeService.toggleTheme()"
                class="p-2 rounded-xl border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white transition-colors"
                title="Toggle Theme">
                <svg *ngIf="themeService.currentTheme() === 'dark'" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                <svg *ngIf="themeService.currentTheme() === 'light'" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            </button>

            @if (token() && notificationsEnabled()) {
                <app-notification-bell />
            }

            <button (click)="addSite()" 
                class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded-xl text-sm font-bold transition-all shadow-lg shadow-sky-600/20">
                Add Site
            </button>

            <!-- Account dropdown when authenticated -->
            <ng-container *ngIf="token()">
                <div class="relative">
                    <button
                        id="account-menu-button"
                        aria-haspopup="true"
                        [attr.aria-expanded]="menuOpen()"
                        class="inline-flex items-center gap-2 rounded-xl px-4 py-2 text-sm font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition-colors"
                        (click)="toggleMenu(); $event.stopPropagation()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        Account
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [class.rotate-180]="menuOpen()" class="transition-transform"><path d="m6 9 6 6 6-6"/></svg>
                    </button>

                    <div *ngIf="menuOpen()"
                        role="menu"
                        aria-labelledby="account-menu-button"
                        class="absolute right-0 mt-3 w-56 bg-slate-900 border border-slate-800 text-slate-100 rounded-2xl shadow-2xl z-110 overflow-hidden animate-in fade-in zoom-in-95 duration-150"
                        (click)="$event.stopPropagation()">                                            <button role="menuitem" class="w-full text-left px-4 py-3 hover:bg-slate-800 flex items-center gap-3 transition-colors text-sm border-b border-slate-800/50"
                                                (click)="router.navigate(['/account/profile']); closeMenu()">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-sky-400"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                                My Profile
                                            </button>
                                            <button role="menuitem" class="w-full text-left px-4 py-3 hover:bg-slate-800 flex items-center gap-3 transition-colors text-sm border-b border-slate-800/50"
                                                (click)="router.navigate(['/account/sites']); closeMenu()">                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-sky-400"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                            My Sites
                        </button>
                        <button role="menuitem" class="w-full text-left px-4 py-3 hover:bg-slate-800 flex items-center gap-3 transition-colors text-sm border-b border-slate-800/50"
                            (click)="router.navigate(['/docs']); closeMenu()">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-sky-400"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M8 7h6"/><path d="M8 11h8"/></svg>
                            Documentation & Help
                        </button>
                        <button role="menuitem" class="w-full text-left px-4 py-3 hover:bg-slate-800 flex items-center gap-3 transition-colors text-sm border-b border-slate-800/50"
                            (click)="router.navigate(['/feedback']); closeMenu()">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-sky-400"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                            Give Feedback
                        </button>
                        <button role="menuitem" class="w-full text-left px-4 py-3 hover:bg-slate-800 flex items-center gap-3 transition-colors text-sm border-b border-slate-800/50"
                            (click)="router.navigate(['/account/change-password']); closeMenu()">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-sky-400"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                            Change Password
                        </button>
                        <button role="menuitem" class="w-full text-left px-4 py-3 hover:bg-rose-500/10 text-rose-400 hover:text-rose-300 flex items-center gap-3 transition-colors text-sm"
                            (click)="logout()">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                            Logout
                        </button>
                    </div>
                </div>
            </ng-container>

            <!-- Login button when not authenticated -->
            <ng-container *ngIf="!token()">
                <button class="text-sm px-3 py-1 rounded bg-transparent border border-slate-700"
                    (click)="router.navigate(['/auth/login'])">Login</button>
            </ng-container>
        </div>

    </div>
</header>
