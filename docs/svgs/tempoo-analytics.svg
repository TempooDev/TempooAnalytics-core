<svg width="360" height="80" viewBox="0 0 360 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo transparente -->
  <rect width="360" height="80" fill="none"/>

  <!-- ICONO -->
  <defs>
    <!-- Degradado del icono -->
    <linearGradient id="tempooGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Sombra suave -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Contenedor del icono -->
  <g transform="translate(10,10)" filter="url(#shadow)">
    <rect x="0" y="0" width="60" height="60" rx="18" fill="url(#tempooGradient)"/>

    <!-- “Sparkline” / analítica dentro del icono -->
    <polyline
      points="10,38 20,30 30,36 40,22 50,28"
      fill="none"
      stroke="#ffffff"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Puntos sobre la línea -->
    <circle cx="10" cy="38" r="2.5" fill="#ffffff"/>
    <circle cx="20" cy="30" r="2.5" fill="#ffffff"/>
    <circle cx="30" cy="36" r="2.5" fill="#ffffff"/>
    <circle cx="40" cy="22" r="2.5" fill="#ffffff"/>
    <circle cx="50" cy="28" r="2.5" fill="#ffffff"/>
  </g>

  <!-- WORDMARK / TEXTO -->
  <!-- Puedes cambiar la fuente por la que uses en tu web (Inter, Poppins, etc.) -->
  <g transform="translate(90,28)">
    <text
      x="0"
      y="18"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="26"
      font-weight="700"
      fill="#0F172A">
      Tempoo
      <tspan fill="#3B82F6">Analytics</tspan>
    </text>

    <text
      x="0"
      y="38"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="12"
      fill="#6B7280">
      Clean, private analytics for modern apps
    </text>
  </g>
</svg>
